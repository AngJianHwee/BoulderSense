version: '3.8'

services:
  # Main Streamlit Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bouldering-pose-app
    ports:
      - "8501:8501"
    volumes:
      # Persist uploads and outputs
      - ./temp_uploads:/app/temp_uploads
      - ./temp_outputs:/app/temp_outputs
      # Mount source for development (optional)
      # - ./app.py:/app/app.py
      # - ./pose_processor.py:/app/pose_processor.py
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    env_file:
      - .env  # Optional: for ngrok token
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ngrok Tunnel (optional - for external access)
  # Uncomment and configure NGROK_AUTH_TOKEN in .env to use
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: bouldering-pose-ngrok
  #   command: http app:8501
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
  #   ports:
  #     - "4040:4040"  # Ngrok web interface
  #   depends_on:
  #     - app
  #   restart: unless-stopped

  # GPU-enabled variant (requires NVIDIA Container Toolkit)
  # app-gpu:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.gpu  # Create separate Dockerfile for GPU
  #   container_name: bouldering-pose-app-gpu
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - ./temp_uploads:/app/temp_uploads
  #     - ./temp_outputs:/app/temp_outputs
  #   environment:
  #     - STREAMLIT_SERVER_PORT=8501
  #     - STREAMLIT_SERVER_ADDRESS=0.0.0.0
  #   env_file:
  #     - .env
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
  #     interval: 30s
